version: '3'
services:
  web:
    image: "weblog:1.0"
    ports:
      - "8080:8080"
    volumes:
      - ./data/web:/app/data

  nacos:
    image: nacos/nacos-server:latest
    container_name: weblog-nacos
    ports:
      - "8848:8848"     # Nacos控制台端口
      - "9848:9848"     # Nacos gRPC端口（Dubbo需要）
      - "9849:9849"     # Nacos gRPC端口（集群时需要）
    environment:
      - MODE=standalone           # 单机模式
      - NACOS_APPLICATION_PORT=8848
      - NACOS_AUTH_ENABLE=false   # 禁用认证（开发环境）
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
    volumes:
      - ./data/nacos/logs:/home/nacos/logs
      - ./data/nacos/conf:/home/nacos/conf

  redis:
    image: "redis:latest"
    volumes:
      - ./data/redis:/data

  mysql:
    image: "mysql:latest"
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456 #PassWord

  rabbitmq:
    image: "rabbitmq:latest"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq

  rocketmq:
    image: "rocketmq:latest"
    volumes:
      -