version: '3'

services:

  nacos:
    image: nacos/nacos-server:2.0.3
    container_name: weblog-nacos
    ports:
      - "8848:8848"     # Nacos控制台端口
      - "9848:9848"     # Nacos gRPC端口（Dubbo需要）
      - "9849:9849"     # Nacos gRPC端口（集群时需要）
    environment:
      - MODE=standalone           # 单机模式
      - NACOS_APPLICATION_PORT=8848
      - NACOS_AUTH_ENABLE=false   # 禁用认证（开发环境）
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
    volumes:
      - nacos-logs:/home/nacos/logs
      - nacos-conf:/home/nacos/conf
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: "redis:6.2"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M

  mysql:
    image: "mysql:8.0"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456

  rabbitmq:
    image: "rabbitmq:3.10-management"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  rocketmq:
    image: "apache/rocketmq:4.9.4"
    ports:
      - "9876:9876"  # NameServer 端口
      - "10911:10911"  # Broker 端口
    volumes:
      - rocketmq-data:/usr/local/rocketmq/store  # 持久化存储数据
      - rocketmq-logs:/usr/local/rocketmq/logs  # 持久化日志

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z  # 写具体版本，生产别用 latest
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    environment:
      MINIO_ROOT_USER: admin          # 以前叫 MINIO_ACCESS_KEY
      MINIO_ROOT_PASSWORD: admin123   # 以前叫 MINIO_SECRET_KEY
    volumes:
      - minio-data:/data
      - minio-logs:/logs
    command: server /data --console-address ":9001"   # ← 这一行必须存在

  web:
    image: "weblog:1.0"
    ports:
      - "8080:8080"
    volumes:
      - web-data:/app/data
    depends_on:
      - mysql
      - nacos

volumes:
  minio-logs:
    driver: local
  minio-data:
    driver: local
  web-data:
    driver: local
  nacos-logs:
    driver: local
  nacos-conf:
    driver: local
  redis-data:
    driver: local
  mysql-data:
    driver: local
  rabbitmq-data:
    driver: local
  rocketmq-data:
    driver: local
  rocketmq-logs:
    driver: local